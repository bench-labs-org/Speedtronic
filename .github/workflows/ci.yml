name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests examples && ruff format --check src tests examples
      - name: Tests
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install documentation dependencies
        run: npm ci --prefix docs-site
      - name: Build documentation
        run: npm run build --prefix docs-site
      - name: Check working tree
        run: git diff --exit-code -- docs-site/docs/reference/generated-source-inventory.md

  pdf:
    name: Documentation PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          npm ci --prefix docs-site
          python -m pip install playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Build site and PDF
        run: |
          npm run build --prefix docs-site
          python docs-site/scripts/build_pdf.py
      - name: Validate PDF
        run: |
          python - <<'PY'
          import pathlib, pymupdf
          pdf = pathlib.Path("docs-site/static/pdf/speedtronic-documentation.pdf")
          assert pdf.is_file(), "PDF was not produced"
          assert pdf.stat().st_size > 200_000, "PDF is suspiciously small"
          with pymupdf.open(pdf) as doc:
              assert doc.page_count > 50, f"only {doc.page_count} pages"
              text = " ".join(doc[i].get_text() for i in range(doc.page_count))
          for needle in ("Speedtronic Documentation", "Local quickstart",
                         "DumbDiLoCo", "Muon", "Glossary"):
              assert needle in text, f"missing section: {needle}"
          print(f"PDF OK: {doc.page_count} pages, {pdf.stat().st_size // 1024} KB")
          PY
      - name: Check working tree
        run: git diff --exit-code -- docs-site/docs/reference/generated-source-inventory.md

  package:
    name: Distribution checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine check-wheel-contents
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: |
          twine check dist/*
          check-wheel-contents dist/*.whl

  skill:
    name: Agent skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validator
        run: python -m pip install skills-ref
      - name: Validate skill against the Agent Skills spec
        run: agentskills validate skills/speedtronic
      - name: Check size budget and internal links
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("skills/speedtronic")
          skill = root / "SKILL.md"
          lines = skill.read_text(encoding="utf-8").splitlines()
          if len(lines) > 500:
              sys.exit(f"SKILL.md is {len(lines)} lines; progressive disclosure budget is 500")
          blob = "\n".join(p.read_text(encoding="utf-8") for p in sorted((root / "references").glob("*.md")))
          targets = set(re.findall(r"\]\((references/[a-z0-9-]+\.md)\)", blob + skill.read_text(encoding="utf-8")))
          missing = [t for t in sorted(targets) if not (root / t).exists()]
          if missing:
              sys.exit("broken skill links: " + ", ".join(missing))
          print(f"SKILL.md {len(lines)} lines, {len(targets)} reference links OK")
          PY
