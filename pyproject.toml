[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speedtronic"
version = "0.1.0"
description = "A fast, efficient, architecture-neutral training engine with DumbDiLoCo"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "BenchLabs"}]
dependencies = [
  "torch>=2.1",
  "safetensors>=0.4",
  "PyYAML>=6.0",
  "numpy>=1.24",
  "huggingface-hub>=0.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
]
logging = [
  "wandb>=0.16",
  "tensorboard>=2.14",
]

[project.scripts]
speedtronic = "speedtronic.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
