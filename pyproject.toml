[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speedtronic"
version = "2.0.0"
description = "A fast, efficient, architecture-neutral training engine with DumbDiLoCo"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "BenchLabs"}]
keywords = [
  "artificial-intelligence",
  "deep-learning",
  "distributed-training",
  "pytorch",
  "training",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "safetensors>=0.4",
  "PyYAML>=6.0",
  "numpy>=1.24",
  "huggingface-hub>=0.23",
]

[project.urls]
Homepage = "https://github.com/bench-labs-org/Speedtronic"
Repository = "https://github.com/bench-labs-org/Speedtronic"
Issues = "https://github.com/bench-labs-org/Speedtronic/issues"
Documentation = "https://speedtronic-docs.pages.dev/"
Changelog = "https://github.com/bench-labs-org/Speedtronic/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
  "tomli>=2.0; python_version < '3.11'",
]
logging = [
  "wandb>=0.16",
  "tensorboard>=2.14",
]
release = [
  "build>=1.2",
  "check-wheel-contents>=0.6",
  "twine>=6.0",
]

[project.scripts]
speedtronic = "speedtronic.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["speedtronic*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
